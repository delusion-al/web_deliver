name: AI Maintenance Orchestrator

on:
  issues:
    types: [opened, labeled]

jobs:
  run-agent:
    if: contains(github.event.issue.labels.*.name, 'ai-agent-pending')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need push capabilities
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Required for Astro check

      - name: Install dependencies
        run: |
          npm ci
          cd scripts/ai-agent
          npm install
      
      - name: Run Multi-Agent Cluster
        env:
          # Model agnostic orchestration keys. You only need to provide one in your Repository Secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Issue Context Context
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cd scripts/ai-agent
          npx ts-node src/index.ts

      - name: Check for Code Changes
        id: git-diff
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request with Auto-Fix
        if: steps.git-diff.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(ai-agent): resolve issue #${{ github.event.issue.number }}"
          title: "[AI-FIX] Resolve Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            ## Automated Multi-Agent Fix 🤖
            This PR was generated by the `open-multi-agent` orchestrator.
            
            **Resolves:** #${{ github.event.issue.number }}
            
            Please review the changes. If auto-merge is enabled, and the AST tests pass, this will deploy to production.
          branch: "ai-fix/issue-${{ github.event.issue.number }}"
          delete-branch: true
          
      - name: Mark Issue as Investigated
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ I have investigated your request and pushed a proposed fix. Check the linked Pull Request for details!'
            })
